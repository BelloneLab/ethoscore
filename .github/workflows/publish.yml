name: Native installers and releases

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows-x86_64
          - runner: ubuntu-22.04
            platform: Linux-x86_64
          - runner: macos-15
            platform: macOS-arm64
          - runner: macos-15-intel
            platform: macOS-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install application and build dependencies
        run: python -m pip install -r requirements.txt 'pyinstaller>=6.11'
      - name: Validate installer transactions and malicious-archive rejection
        run: python -m unittest installer.test_backend -v
      - name: Validate arena detection, export, and annotation workflows
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v
      - name: Build native application and graphical setup
        env:
          ETHOSCORE_BUILD_VERSION: ${{ github.ref_name }}-${{ github.sha }}
        run: python -m installer.build --version "$ETHOSCORE_BUILD_VERSION"
        shell: bash
      - name: Smoke-test the actual native setup and installed application
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python -m installer.native_smoke
      - name: Upload native installers and update payloads
        uses: actions/upload-artifact@v4
        with:
          name: Ethoscore-${{ matrix.platform }}
          path: dist/releases/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Ethoscore-*
          path: publish
          merge-multiple: true
      - name: Publish native installer release
        uses: ncipollo/release-action@v1
        with:
          artifacts: publish/*
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
